services:
  # Backend API
  - type: web
    name: nyayasetu-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements-prod.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: GEMINI_API_KEY
        sync: false
      - key: DISABLE_ML_FEATURES
        value: "true"
    healthCheckPath: /
    
